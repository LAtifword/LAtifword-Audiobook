name: Build Habibi runtime-fix debug APK

on:
  push:
    branches: [habibi-runtime-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODEL_REV: 78b2d00397fc1bc8064d8e4d849e794fa8325245
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Stage runtime-fix project
        run: |
          set -euxo pipefail
          rm -rf standalone-android release
          cp -a v2-src/standalone-android standalone-android
          mkdir -p release
          BUILD=standalone-android/app/build.gradle.kts
          ENGINE=standalone-android/app/src/main/java/com/latif/audiobook/offline/SilmaF5Engine.kt
          SERVICE=standalone-android/app/src/main/java/com/latif/audiobook/offline/AudiobookService.kt
          grep -q 'versionName = "3.4.0-habibi-msa"' "$BUILD"
          grep -q 'applicationIdSuffix = ".habibifix"' "$BUILD"
          grep -q 'HABIBI_SAFE_MAX_FRAMES = 3900L' "$SERVICE"
          grep -q 'HABIBI_MODEL_MAX_FRAMES = 4096L' "$SERVICE"
          grep -q 'buildFrameSafeChunks' "$SERVICE"
          grep -q 'habibi-f5/model.onnx' "$ENGINE"

      - name: Download exact pinned Habibi MSA assets
        run: |
          set -euxo pipefail
          ASSETS=standalone-android/app/src/main/assets/habibi-f5
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          BASE="https://huggingface.co/OpenVoiceOS/phoonnx-f5tts/resolve/$MODEL_REV/habibi-tts-msa"
          for file in model.onnx F5_Preprocess.onnx F5_Decode.onnx vocab.txt config.json; do
            curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/$file" "$BASE/$file?download=true"
          done
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/default_ref.wav" 'https://huggingface.co/spaces/silma-ai/silma-tts-v1-demo/resolve/main/ar.ref.24k.wav?download=true'

          cat > /tmp/habibi.sha256 <<'EOF'
          a97e2a7003ebf671890ba536f0737f1a90b03f7365f07caa3c688ace36745bba  standalone-android/app/src/main/assets/habibi-f5/model.onnx
          dcf8c549dc0887194d2a0c34130e632b75f96658d46397120853c5227389cad3  standalone-android/app/src/main/assets/habibi-f5/F5_Preprocess.onnx
          b5679f9279ea797db83b67477ebfe2f6f0a38eadf7bdc351a1f7eaae9b302ab9  standalone-android/app/src/main/assets/habibi-f5/F5_Decode.onnx
          af6370f72138edd7ad7cc5bf4c940b1976b559e1abf797ab7b8e2e4218415d30  standalone-android/app/src/main/assets/habibi-f5/config.json
          4de4460ff1ef7cb40c2e564bc1ee2f3198164d10ce71380290986e483ba7e19c  standalone-android/app/src/main/assets/habibi-f5/vocab.txt
          b6b88232c3b851a3d9833c66349c71b2527de346b467ccba944809bad776c7ae  standalone-android/app/src/main/assets/habibi-f5/default_ref.wav
          EOF
          sha256sum -c /tmp/habibi.sha256

      - name: Verify model contract and proven frame boundary
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          python -m pip install --quiet 'onnx>=1.17,<2'
          python - <<'PY'
          import json, onnx
          from pathlib import Path
          root=Path('app/src/main/assets/habibi-f5')
          cfg=json.loads((root/'config.json').read_text(encoding='utf-8'))
          mapping={k:int(v) for k,v in cfg['phoneme_id_map'].items()}
          vocab=(root/'vocab.txt').read_text(encoding='utf-8').splitlines()
          assert cfg['num_symbols'] == 2666
          assert len(mapping) == 2666 and max(mapping.values()) == 2665
          assert len(vocab) == 2666
          assert all(vocab[idx] == token for token,idx in mapping.items())
          expected={
            'F5_Preprocess.onnx':({'audio','text_ids','max_duration'},{'noise','rope_cos_q','rope_sin_q','rope_cos_k','rope_sin_k','cat_mel_text','cat_mel_text_drop','ref_signal_len'}),
            'model.onnx':({'noise','rope_cos_q','rope_sin_q','rope_cos_k','rope_sin_k','cat_mel_text','cat_mel_text_drop','time_step.1'},{'denoised','time_step'}),
            'F5_Decode.onnx':({'denoised','ref_signal_len'},{'output_audio'}),
          }
          for name,(need_in,need_out) in expected.items():
              model=onnx.load(str(root/name), load_external_data=False)
              assert need_in <= {x.name for x in model.graph.input}
              assert need_out <= {x.name for x in model.graph.output}
          print('Habibi runtime-fix contract OK: vocab 0..2665; model frame ceiling proven separately as 4096.')
          PY

      - name: Build side-by-side installable debug APK
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:verifyHabibiAssets :app:compileDebugKotlin :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" ../release/LATIF-VOICE-STUDIO-v3.4.0-HABIBI-RUNTIME-FIX-DEBUG.apk
          sha256sum ../release/*.apk | tee ../release/SHA256SUMS.txt
          stat -c '%n %s bytes' ../release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LATIF-VOICE-STUDIO-v3.4.0-HABIBI-RUNTIME-FIX-DEBUG
          path: |
            release/LATIF-VOICE-STUDIO-v3.4.0-HABIBI-RUNTIME-FIX-DEBUG.apk
            release/SHA256SUMS.txt
          retention-days: 14
          compression-level: 0
