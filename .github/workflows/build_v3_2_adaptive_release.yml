name: Build LATIF Voice Studio v3.2 Adaptive Release

on:
  push:
    branches:
      - latif-voice-studio-v3.2-hybrid
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Stage v3.2 source and SILMA assets
        run: |
          set -euxo pipefail
          rm -rf standalone-android release
          cp -a v2-src/standalone-android standalone-android
          mkdir -p release
          grep -q 'versionName = "3.2.0"' standalone-android/app/build.gradle.kts
          grep -q 'versionCode = 9' standalone-android/app/build.gradle.kts
          grep -q 'NNAPI_FP16' standalone-android/app/src/main/java/com/latif/audiobook/offline/SilmaF5Engine.kt
          grep -q 'MIN_STEPS = 8' standalone-android/app/src/main/java/com/latif/audiobook/offline/SilmaF5Engine.kt
          grep -q 'DEFAULT_NFE_STEPS = 12' standalone-android/app/src/main/java/com/latif/audiobook/offline/AudiobookService.kt
          grep -q 'EXTRA_NFE_STEPS' standalone-android/app/src/main/java/com/latif/audiobook/offline/AudiobookService.kt

          ASSETS=standalone-android/app/src/main/assets/silma-f5
          mkdir -p "$ASSETS"
          BASE='https://huggingface.co/OpenVoiceOS/phoonnx-f5tts/resolve/main/silma-tts-v1'
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/model.onnx" "$BASE/model.onnx?download=true"
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/F5_Preprocess.onnx" "$BASE/F5_Preprocess.onnx?download=true"
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/F5_Decode.onnx" "$BASE/F5_Decode.onnx?download=true"
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/vocab.txt" "$BASE/vocab.txt?download=true"
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/config.json" "$BASE/config.json?download=true"
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 -o "$ASSETS/default_ref.wav" 'https://huggingface.co/spaces/silma-ai/silma-tts-v1-demo/resolve/main/ar.ref.24k.wav?download=true'
          test -s "$ASSETS/model.onnx"
          test -s "$ASSETS/F5_Preprocess.onnx"
          test -s "$ASSETS/F5_Decode.onnx"
          test -s "$ASSETS/vocab.txt"
          test -s "$ASSETS/default_ref.wav"

      - name: Verify ONNX interfaces
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          python -m pip install --quiet 'onnx>=1.17,<2'
          python - <<'PY'
          import onnx
          from pathlib import Path
          root = Path('app/src/main/assets/silma-f5')
          expected = {
              'F5_Preprocess.onnx': ({'audio','text_ids','max_duration'}, {'noise','rope_cos_q','rope_sin_q','rope_cos_k','rope_sin_k','cat_mel_text','cat_mel_text_drop','ref_signal_len'}),
              'model.onnx': ({'noise','rope_cos_q','rope_sin_q','rope_cos_k','rope_sin_k','cat_mel_text','cat_mel_text_drop','time_step.1'}, {'denoised','time_step'}),
              'F5_Decode.onnx': ({'denoised','ref_signal_len'}, {'output_audio'}),
          }
          for name,(ri,ro) in expected.items():
              m=onnx.load(str(root/name), load_external_data=False)
              ins={x.name for x in m.graph.input}; outs={x.name for x in m.graph.output}
              assert ri <= ins, (name, ri-ins)
              assert ro <= outs, (name, ro-outs)
          print('SILMA interfaces verified')
          PY

      - name: Compile and assemble release
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileReleaseKotlin
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/silma-f5/model.onnx'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonnxruntime.so'

      - name: Align APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 standalone-android/app/build/outputs/apk/release/app-release-unsigned.apk release/LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-ALIGNED.apk
          "$BT/zipalign" -c -v 4 release/LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-ALIGNED.apk >/dev/null

      - name: Sign with permanent LATIF identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VAULT_RUN=34709949240
          VAULT_NAME='LATIF-AUDIOBOOK-AI-v2.0.1-FUTURE-UPGRADE-VAULT'
          VAULT_ZIP_NAME='LATIF-AUDIOBOOK-AI-v2.0.1-FUTURE-UPGRADE-VAULT.zip'
          EXPECTED_CERT_SHA256='ee0283bc5a72f2b7a9b7285e2de17c52a9dfb524fb58354c32aefb4fbba258f5'
          rm -rf /tmp/latif-vault-download /tmp/latif-vault
          mkdir -p /tmp/latif-vault-download /tmp/latif-vault
          gh run download "$VAULT_RUN" --repo LAtifword/LAtifword-Audiobook --name "$VAULT_NAME" --dir /tmp/latif-vault-download
          test -s "/tmp/latif-vault-download/$VAULT_ZIP_NAME"
          unzip -q "/tmp/latif-vault-download/$VAULT_ZIP_NAME" -d /tmp/latif-vault
          KEYSTORE=/tmp/latif-vault/LATIF-AUDIOBOOK-AI-RELEASE-KEY.jks
          PASS_NOTE=/tmp/latif-vault/KEEP-THIS-KEY-PRIVATE.txt
          test -s "$KEYSTORE"
          test -s "$PASS_NOTE"
          STORE_PASS="$(sed -n 's/^Store password: //p' "$PASS_NOTE" | head -n1)"
          test -n "$STORE_PASS"
          export LATIF_STORE_PASS="$STORE_PASS"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          INPUT=release/LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-ALIGNED.apk
          SIGNED=release/LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-SIGNED.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias latif-audiobook-release --ks-pass env:LATIF_STORE_PASS --key-pass env:LATIF_STORE_PASS --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$INPUT"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee release/SIGNATURE-VERIFY.txt
          CERT_SHA="$("$BT/apksigner" verify --print-certs "$SIGNED" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n1)"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          "$BT/zipalign" -c -v 4 "$SIGNED" >/dev/null
          unzip -t "$SIGNED" >/dev/null
          sha256sum "$SIGNED" > release/SHA256SUMS.txt
          stat -c '%n %s bytes' "$SIGNED"
          unset LATIF_STORE_PASS STORE_PASS
          rm -rf /tmp/latif-vault-download /tmp/latif-vault

      - name: Release manifest
        run: |
          set -euxo pipefail
          cat > release/MODEL-MANIFEST.txt <<'EOF'
          LATIF VOICE STUDIO v3.2.0 ADAPTIVE
          Primary TTS: SILMA TTS v1 / F5-TTS ONNX
          Runtime: Microsoft ONNX Runtime Android 1.28.0
          Backend order: XNNPACK ARM -> Android NNAPI FP16 -> Android NNAPI -> tuned ORT CPU
          F5 modes: Turbo 8 / Balanced 12 / Studio 16 / High 24 / Max 32
          Default: Balanced 12
          Output: 24 kHz -> AAC-LC 128 kbps M4A
          Package: com.latif.audiobook.offline
          Version: 3.2.0 (versionCode 9)
          ABI: arm64-v8a
          Runtime API/account/server: none
          EOF
          git rev-parse HEAD > release/SOURCE-COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-SIGNED
          path: |
            release/LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-SIGNED.apk
            release/SIGNATURE-VERIFY.txt
            release/SHA256SUMS.txt
            release/MODEL-MANIFEST.txt
            release/SOURCE-COMMIT.txt
          retention-days: 30
          compression-level: 0

      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          APK=release/LATIF-VOICE-STUDIO-v3.2.0-ADAPTIVE-SIGNED.apk
          TAG="latif-voice-studio-v3.2.0-adaptive-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --repo LAtifword/LAtifword-Audiobook --target "$GITHUB_SHA" --title 'LATIF Voice Studio 3.2 — Adaptive Mobile F5' --notes 'Fully offline Android audiobook studio. Adds selectable 8/12/16/24/32-step SILMA F5 modes, NNAPI FP16 attempt, XNNPACK/NNAPI/CPU fallback, direct tensor-buffer PCM extraction, adaptive chunk sizing, real-time ETA/RTF reporting, and one-section preview. Same package and permanent LATIF signing identity. No API key, account, server, or runtime model download.' "$APK" release/SIGNATURE-VERIFY.txt release/SHA256SUMS.txt release/MODEL-MANIFEST.txt release/SOURCE-COMMIT.txt
