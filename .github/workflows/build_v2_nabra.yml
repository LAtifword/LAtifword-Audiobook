name: Build LATIF Audiobook AI v2 Nabra

on:
  push:
    branches:
      - latif-audiobook-v2-nabra
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Stage Android source
        run: |
          set -euxo pipefail
          rm -rf standalone-android
          cp -a v2-src/standalone-android standalone-android
          test -f standalone-android/app/build.gradle.kts
          test -f standalone-android/app/src/main/java/com/latif/audiobook/offline/MainActivity.kt
          test -f standalone-android/app/src/main/java/com/latif/audiobook/offline/AudiobookService.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Nabra Arabic neural runtime
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          mkdir -p app/libs app/src/main/assets/nabra-82m

          curl -L --fail --retry 5 --retry-delay 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

          curl -L --fail --retry 8 --retry-delay 5 \
            -o app/src/main/assets/nabra-82m/model.fp16.onnx \
            'https://huggingface.co/marwanelamami/nabra-82m-sherpa-onnx/resolve/main/model.fp16.onnx?download=true'
          curl -L --fail --retry 8 --retry-delay 5 \
            -o app/src/main/assets/nabra-82m/tokens.txt \
            'https://huggingface.co/marwanelamami/nabra-82m-sherpa-onnx/resolve/main/tokens.txt?download=true'
          curl -L --fail --retry 8 --retry-delay 5 \
            -o app/src/main/assets/nabra-82m/voices.bin \
            'https://huggingface.co/marwanelamami/nabra-82m-sherpa-onnx/resolve/main/voices.bin?download=true'

          curl -L --fail --retry 5 --retry-delay 3 \
            -o /tmp/piper-ar-data.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-low.tar.bz2
          mkdir -p /tmp/piper-ar-data
          tar -xjf /tmp/piper-ar-data.tar.bz2 -C /tmp/piper-ar-data
          cp -a /tmp/piper-ar-data/vits-piper-en_US-amy-low/espeak-ng-data app/src/main/assets/nabra-82m/

          test -s app/src/main/assets/nabra-82m/model.fp16.onnx
          test -s app/src/main/assets/nabra-82m/tokens.txt
          test -s app/src/main/assets/nabra-82m/voices.bin
          test -d app/src/main/assets/nabra-82m/espeak-ng-data
          ls -lh app/src/main/assets/nabra-82m/model.fp16.onnx app/src/main/assets/nabra-82m/voices.bin
          du -sh app/src/main/assets/nabra-82m

      - name: Compile Kotlin and build APK
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:compileDebugKotlin
          gradle --no-daemon --stacktrace :app:assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk
          sha256sum ../release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk | tee ../release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk.sha256
          unzip -t ../release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ../release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk
          ls -lh ../release/

      - uses: actions/upload-artifact@v4
        with:
          name: LATIF-AUDIOBOOK-AI-v2-NABRA-APK
          path: release/*
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="latif-audiobook-v2-nabra-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk \
            release/LATIF-AUDIOBOOK-AI-v2.0.0-NABRA.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "LATIF Audiobook AI v2.0 · Nabra Arabic Studio" \
            --notes "Standalone Android Arabic audiobook studio. Nabra-82M FP16 StyleTTS2/Kokoro-family Arabic model, 24 kHz MSA narrator, PDF/EPUB/DOCX/TXT, full-book foreground generation, semantic sentence-boundary chunks, tight joins, M4A output. No API, account, server, Termux, or post-install model download."
