name: Build LATIF Audiobook AI v2.1.1 Signed Runtime Fix

on:
  push:
    branches:
      - latif-audiobook-v2.1-nabra-voice-profiles
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Stage source
        run: |
          set -euxo pipefail
          rm -rf standalone-android
          cp -a v2-src/standalone-android standalone-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle Nabra and Rawi models
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          mkdir -p app/libs app/src/main/assets/nabra-82m app/src/main/assets/rawi-diacritizer
          curl -L --fail --retry 5 -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          curl -L --fail --retry 8 -o app/src/main/assets/nabra-82m/model.fp16.onnx 'https://huggingface.co/marwanelamami/nabra-82m-sherpa-onnx/resolve/main/model.fp16.onnx?download=true'
          curl -L --fail --retry 8 -o app/src/main/assets/nabra-82m/tokens.txt 'https://huggingface.co/marwanelamami/nabra-82m-sherpa-onnx/resolve/main/tokens.txt?download=true'
          curl -L --fail --retry 8 -o app/src/main/assets/nabra-82m/voices.bin 'https://huggingface.co/marwanelamami/nabra-82m-sherpa-onnx/resolve/main/voices.bin?download=true'
          curl -L --fail --retry 5 -o /tmp/piper.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-low.tar.bz2
          mkdir -p /tmp/piper && tar -xjf /tmp/piper.tar.bz2 -C /tmp/piper
          cp -a /tmp/piper/vits-piper-en_US-amy-low/espeak-ng-data app/src/main/assets/nabra-82m/
          curl -L --fail --retry 8 -o app/src/main/assets/rawi-diacritizer/rawi_ensemble.int8.onnx 'https://huggingface.co/TigreGotico/rawi-ensemble/resolve/main/rawi_ensemble.int8.onnx?download=true'
          curl -L --fail --retry 8 -o app/src/main/assets/rawi-diacritizer/vocab.json 'https://huggingface.co/TigreGotico/rawi-ensemble/resolve/main/vocab.json?download=true'
          test -s app/src/main/assets/nabra-82m/model.fp16.onnx
          test -s app/src/main/assets/rawi-diacritizer/rawi_ensemble.int8.onnx

      - name: Build and validate unsigned APK
        working-directory: standalone-android
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:compileReleaseKotlin :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonnxruntime.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonnxruntime4j_jni.so'
          unzip -l "$APK" | grep -q 'assets/nabra-82m/model.fp16.onnx'
          unzip -l "$APK" | grep -q 'assets/rawi-diacritizer/rawi_ensemble.int8.onnx'
          mkdir -p ../apk-only
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$APK" \
            ../apk-only/LATIF-AUDIOBOOK-AI-v2.1.1-NABRA-RAWI-RUNTIME-FIX-ALIGNED-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 ../apk-only/LATIF-AUDIOBOOK-AI-v2.1.1-NABRA-RAWI-RUNTIME-FIX-ALIGNED-UNSIGNED.apk >/dev/null

      - name: Sign with permanent LATIF release certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VAULT_RUN=34709949240
          VAULT_NAME='LATIF-AUDIOBOOK-AI-v2.0.1-FUTURE-UPGRADE-VAULT'
          VAULT_ZIP_NAME='LATIF-AUDIOBOOK-AI-v2.0.1-FUTURE-UPGRADE-VAULT.zip'
          EXPECTED_CERT_SHA256='ee0283bc5a72f2b7a9b7285e2de17c52a9dfb524fb58354c32aefb4fbba258f5'

          rm -rf /tmp/latif-vault-download /tmp/latif-vault
          mkdir -p /tmp/latif-vault-download /tmp/latif-vault
          gh run download "$VAULT_RUN" --name "$VAULT_NAME" --dir /tmp/latif-vault-download
          test -s "/tmp/latif-vault-download/$VAULT_ZIP_NAME"
          unzip -q "/tmp/latif-vault-download/$VAULT_ZIP_NAME" -d /tmp/latif-vault

          KEYSTORE=/tmp/latif-vault/LATIF-AUDIOBOOK-AI-RELEASE-KEY.jks
          PASS_NOTE=/tmp/latif-vault/KEEP-THIS-KEY-PRIVATE.txt
          test -s "$KEYSTORE"
          test -s "$PASS_NOTE"
          STORE_PASS="$(sed -n 's/^Store password: //p' "$PASS_NOTE" | head -n1)"
          test -n "$STORE_PASS"
          export LATIF_STORE_PASS="$STORE_PASS"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=apk-only/LATIF-AUDIOBOOK-AI-v2.1.1-NABRA-RAWI-RUNTIME-FIX-ALIGNED-UNSIGNED.apk
          SIGNED=apk-only/LATIF-AUDIOBOOK-AI-v2.1.1-NABRA-RAWI-RUNTIME-FIX-SIGNED.apk

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias latif-audiobook-release \
            --ks-pass env:LATIF_STORE_PASS \
            --key-pass env:LATIF_STORE_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee apk-only/SIGNATURE-VERIFY.txt
          CERT_SHA="$("$BT/apksigner" verify --print-certs "$SIGNED" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n1)"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          "$BT/zipalign" -c -v 4 "$SIGNED" >/dev/null
          unzip -t "$SIGNED" >/dev/null

          rm -f "$UNSIGNED"
          sha256sum "$SIGNED" > apk-only/SHA256SUMS.txt
          unset LATIF_STORE_PASS STORE_PASS
          rm -rf /tmp/latif-vault-download /tmp/latif-vault
          ls -lh apk-only/

      - uses: actions/upload-artifact@v4
        with:
          name: LATIF-AUDIOBOOK-AI-v2.1.1-RUNTIME-FIX-SIGNED
          path: apk-only/*
          retention-days: 30
          compression-level: 0
